<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f1e8">
<title>Hors connexion</title>
<style>
  /* Shown by the installed application when the phone has no network (sw.js). */
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #292b2d; background: #f5f1e8; font: 16px/1.5 "Arial", sans-serif; text-align: center; }
  main { max-width: 360px; }
  h1 { margin: 0 0 10px; font-size: 26px; }
  p { margin: 0 0 22px; color: #5d6266; }
  button { padding: 12px 20px; color: #fff; background: #b7353f; border: 0; border-radius: 4px; font: 700 15px "Arial", sans-serif; }
</style>
</head>
<body>
<main>
  <h1 data-text="title">Pas de connexion</h1>
  <p data-text="body">L’agenda a besoin d’Internet pour afficher des dates à jour. Vérifiez le réseau de votre téléphone, puis réessayez.</p>
  <button type="button" data-text="retry" onclick="location.reload()">Réessayer</button>
</main>
<script>
  // A static page (no server at hand): its texts in the languages of the application, chosen from
  // the phone's language; French otherwise.
  const texts = {
    en: { page: "Offline", title: "No connection", body: "The calendar needs the Internet to show up-to-date dates. Check your phone’s network, then try again.", retry: "Try again" },
    br: { page: "Ezlinenn", title: "Kennask ebet", body: "Ezhomm en deus an deiziataer eus Internet evit diskouez deiziadoù hizivaet. Gwiriit rouedad ho pellgomzer, ha klaskit en-dro.", retry: "Klask en-dro" },
    es: { page: "Sin conexión", title: "Sin conexión", body: "La agenda necesita Internet para mostrar fechas actualizadas. Compruebe la red de su teléfono y vuelva a intentarlo.", retry: "Reintentar" },
  };
  const language = (navigator.languages || [navigator.language || ""]).map((code) => code.toLowerCase().split("-")[0]).find((code) => code in texts || code === "fr");
  if (language && texts[language]) {
    document.documentElement.lang = language;
    document.title = texts[language].page;
    document.querySelectorAll("[data-text]").forEach((element) => { element.textContent = texts[language][element.dataset.text]; });
  }
</script>
</body>
</html>
